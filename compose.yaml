services:
  mongodb:

    image: "${MONGO_IMAGE:-mongo:9.0.4}"

    ports:
      - "${MONGO_HOST_PORT:?Set MONGO_HOST_PORT}:27017"

    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}"
      MONGO_INITDB_DATABASE: "${MONGODB_DB:-feblog}"
      MONGO_APP_USERNAME: "${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME}"
      MONGO_APP_PASSWORD: "${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}"

    volumes:
      - ./mongo_data:/data/db:Z
      - type: bind
        source: ./docker/mongo/initdb
        target: /docker-entrypoint-initdb.d
        read_only: true
        bind:
          create_host_path: false
          selinux: z

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --host 127.0.0.1
          --username "$$MONGO_APP_USERNAME"
          --password "$$MONGO_APP_PASSWORD"
          --authenticationDatabase "$$MONGO_INITDB_DATABASE"
          --eval 'db.getSiblingDB(process.env.MONGO_INITDB_DATABASE).posts.findOne()'
          > /dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

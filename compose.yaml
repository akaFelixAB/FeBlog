services:
  app:
    image: ghcr.io/pnpm/pnpm:11.3.0

    ports:
      - 4321:4321
    working_dir: /app

    command: >
      bash -c "
      pnpm runtime set node 24 -g
      && pnpm install --frozen-lockfile
      && pnpm prune
      && pnpm run dev --host 0.0.0.0"

    environment:
      MONGODB_DB: "${MONGODB_DB:-feblog}"
      MONGODB_URI: "mongodb://${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}@mongodb:27017/${MONGODB_DB:-feblog}?authSource=${MONGODB_DB:-feblog}"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4321"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

    volumes:
      - ./:/app
      - /app/node_modules

    depends_on:
      mongodb:
        condition: service_healthy
  mongodb:

    image: "${MONGO_IMAGE:-mongo:9.0.4}"

    ports:
      - "${MONGO_HOST_PORT:?Set MONGO_HOST_PORT}:27017"

    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}"
      MONGO_INITDB_DATABASE: "${MONGODB_DB:-feblog}"
      MONGO_APP_USERNAME: "${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME}"
      MONGO_APP_PASSWORD: "${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}"

    volumes:
      - ./mongo_data:/data/db:Z
      - type: bind
        source: ./docker/mongo/initdb
        target: /docker-entrypoint-initdb.d
        read_only: true
        bind:
          create_host_path: false
          selinux: z

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --host 127.0.0.1
          --username "$$MONGO_APP_USERNAME"
          --password "$$MONGO_APP_PASSWORD"
          --authenticationDatabase "$$MONGO_INITDB_DATABASE"
          --eval 'db.getSiblingDB(process.env.MONGO_INITDB_DATABASE).posts.findOne()'
          > /dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
